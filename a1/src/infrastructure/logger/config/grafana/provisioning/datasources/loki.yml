# ============================================================
# Grafana — Auto-provision Loki as the default datasource.
# File is read once on startup; restart Grafana to reload.
# ============================================================

apiVersion: 1

deleteDatasources:
  - name: Loki
    orgId: 1

datasources:
  - name: Loki
    type: loki
    orgId: 1
    access: proxy # Grafana server → Loki (never browser → Loki)
    url: http://loki:3100
    isDefault: true
    version: 1
    editable: false # Prevent UI edits; config is source of truth
    jsonData:
      maxLines: 1000
      timeout: 120
      # Link trace IDs found in logs to a tracing datasource (Tempo/Jaeger)
      # Uncomment and configure if you have a tracing backend:
      # derivedFields:
      #   - datasourceUid: tempo
      #     matcherRegex: '"traceId":"(\w+)"'
      #     name: TraceID
      #     url: "${__value.raw}"

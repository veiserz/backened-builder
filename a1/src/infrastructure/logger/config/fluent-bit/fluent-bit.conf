# ============================================================
# Fluent Bit — Production Configuration
# Collects Docker container logs from host filesystem.
# Pipeline: tail → parse JSON → enrich → deduplicate → Loki
# ============================================================

[SERVICE]
    # Flush interval in seconds — lower = more real-time, higher = better batching
    Flush              5
    Daemon             Off
    Log_Level          warn
    Log_File           /dev/stderr
    Parsers_File       /fluent-bit/etc/parsers.conf

    # Built-in HTTP server for health checks and metrics
    HTTP_Server        On
    HTTP_Listen        0.0.0.0
    HTTP_Port          2020

    # How long to wait for graceful shutdown before forcing
    Grace              5

    # Storage: filesystem buffering for backpressure handling
    # If Loki is temporarily unavailable, logs are buffered here.
    storage.path              /var/log/flb-storage/
    storage.sync              normal
    storage.checksum          off
    # Max total filesystem storage across all inputs
    storage.max_chunks_up     256
    # Total memory limit before filesystem overflow kicks in
    storage.backlog_mem_limit 50M


# ── INPUT ────────────────────────────────────────────────────
# Tail Docker json-file logs from host filesystem.
# Uses SQLite DB to track read offsets — survives restarts.
[INPUT]
    Name                tail
    Tag                 docker.<container_id>
    Tag_Regex           \/var\/lib\/docker\/containers\/(?<container_id>[^\/]+)\/
    Path                /var/lib/docker/containers/*/*.log
    # Track file offsets between restarts
    DB                  /var/log/flb_docker.db
    DB.locking          true
    Parser              docker_json
    # Backpressure: pause reading if downstream is slow (Loki down)
    Mem_Buf_Limit       50MB
    storage.type        filesystem
    # Skip lines that exceed parser capacity (malformed/huge)
    Skip_Long_Lines     On
    Skip_Empty_Lines    On
    Refresh_Interval    10
    Rotate_Wait         30
    Read_from_Head      false


# ── FILTERS ─────────────────────────────────────────────────

# 1. Enrich log records with Docker metadata from the socket
[FILTER]
    Name                docker_metadata
    Match               docker.*
    Docker_API_Version  v1.41

# 2. Parse the inner `log` field as JSON (pino structured logs)
[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        json_log
    # Keep original unparsed log field as fallback
    Reserve_Data  On
    Preserve_Key  Off

# 3. Lift nested fields from pino's output to top level for Loki labelling
#    pino logs: { "level": "info", "msg": "...", "service": "api", ... }
[FILTER]
    Name    nest
    Match   docker.*
    Operation  lift
    Nested_under  (none)
    Add_prefix    (none)

# 4. Normalize log level field name (pino emits "level" as string — keep as-is)
#    If you use numeric levels add a Lua filter here to convert 30→"info" etc.

# 5. Drop noisy health-check / readiness probe logs to reduce volume
[FILTER]
    Name    grep
    Match   docker.*
    # Drop logs where msg contains health check patterns
    Exclude msg  (health.?check|healthcheck|GET \/(health|ready|ping|metrics))

# 6. Drop empty log lines
[FILTER]
    Name    grep
    Match   docker.*
    Regex   log  \S

# 7. Clean up internal Docker fields that add cardinality without value
[FILTER]
    Name    modify
    Match   docker.*
    # Remove high-cardinality or irrelevant Docker metadata
    Remove  _p
    Remove  source
    Remove  container_id
    # Rename Docker metadata to consistent names
    Rename  container_name  _container_name
    Rename  image_name      _image_name


# ── OUTPUT ───────────────────────────────────────────────────
# Ship to Loki with structured labels.
# CRITICAL: Keep label set SMALL (< 10 labels, low cardinality only).
# Never use request_id, user_id, trace_id as Loki labels — put them in the log line.
[OUTPUT]
    Name              loki
    Match             docker.*
    Host              loki
    Port              3100
    Tenant_ID         ""

    # ── Labels (low-cardinality static metadata only) ────────
    # These become Loki stream selectors. High-cardinality = OOM.
    Labels            job=docker

    # Extract label values from record fields
    Label_Keys        $app,$env,$level

    # ── Log body ─────────────────────────────────────────────
    # Send full record as JSON (preserves all pino fields for LogQL extraction)
    Line_Format       json

    # Strip fields already promoted to labels (avoid duplication)
    Remove_Keys       _p,_container_name,_image_name,stream

    # ── Reliability / backpressure ───────────────────────────
    # Retry up to 5 times with exponential backoff before dropping
    Retry_Limit       5
    # Parallel workers for throughput
    Workers           2
    # Batch tuning: flush when 1 MB accumulated OR 1 second elapsed
    Batch_Size        1048576
    Batch_Wait        1
    # Drop logs older than 1 week (Loki rejects out-of-order logs)
    Drop_Single_Key   off

    # ── TLS (enable if Loki has TLS configured) ──────────────
    # TLS                On
    # TLS.Verify         On
    # TLS.CA_File        /fluent-bit/certs/loki-ca.crt

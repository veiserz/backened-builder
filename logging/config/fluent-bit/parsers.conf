# ============================================================
# Fluent Bit — Parsers Configuration
# ============================================================

# ── Docker json-file log format ──────────────────────────────
# Docker wraps each log line in: {"log":"...\n","stream":"stdout","time":"..."}
[PARSER]
    Name         docker_json
    Format       json
    Time_Key     time
    Time_Format  %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep    On
    # Decode unicode escape sequences in log values
    Decode_Field_As   json log

# ── Inner JSON (pino structured log body) ───────────────────
# After docker_json extracts the `log` field, this parser
# decodes it if it wasn't already auto-decoded above.
[PARSER]
    Name         json_log
    Format       json
    Time_Key     time
    Time_Format  %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep    On

# ── Fallback: plain text / non-JSON logs ────────────────────
# For containers that don't emit structured JSON.
[PARSER]
    Name         logfmt
    Format       logfmt

# ── NGINX access log (if you log nginx) ─────────────────────
[PARSER]
    Name         nginx
    Format       regex
    Regex        ^(?<remote>[^ ]*) (?<host>[^ ]*) (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<status>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)")?$
    Time_Key     time
    Time_Format  %d/%b/%Y:%H:%M:%S %z
    Time_Keep    On
